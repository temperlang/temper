<circle cx="293.0" cy="113.4" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>GitHub, f0f0715 (2026-11-24): 0.6 MiB per 1,000 lines</title></circle>
<text class="label" x="542" y="117.4">GitHub: 0.6</text>
