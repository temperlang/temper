<text x="48" y="214.0" text-anchor="end">0.2</text>
<line x1="56" x2="530" y1="164.0" y2="164.0" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="168.0" text-anchor="end">0.4</text>
<line x1="56" x2="530" y1="118.0" y2="118.0" stroke="var(--grid)" stroke-width="1"/>
<text x="48" y="122.0" text-anchor="end">0.6</text>
<line x1="56" x2="530" y1="72.0" y2="72.0" stroke="var(--grid)" stroke-width="1"/>
