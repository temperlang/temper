# Monthly pull requests bumping the GitHub Actions the workflows use,
# which are pinned by commit SHA with a version comment that Dependabot
# keeps in step. Only releases at least two weeks old (cooldown), as
# docs/contributing/ci.md asks. Every bump, major ones too, comes in one
# pull request for the ecosystem, the workflows and the local actions
# together, so a version moves everywhere at once; read the majors'
# release notes before merging, as some workflows (Pages, releases,
# nightly) only run after merging. Cargo and npm aren't here (yet):
# their lockfiles are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the local actions they share.
    directories: ["/", "/.github/actions/toolchains", "/.github/actions/ccache"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
        update-types: [major, minor, patch]
    ignore:
      # Pinned to the commit of its 1.85.0 branch (the toolchain is the
      # branch's name; no version tags), so bumped by hand.
      - dependency-name: dtolnay/rust-toolchain
